<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康管理 · 管理后台</title>
<!-- 站点图标:与用户端 index.html 同一枚品牌徽章(渐变 + 白色 W),后台不再用 🛠 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230e8a63'/><stop offset='1' stop-color='%230a5c43'/></linearGradient></defs><rect x='1' y='1' width='62' height='62' rx='18' fill='url(%23g)'/><path d='M17 21L25 44L32 28L39 44L47 21' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .adm-wrap{max-width:860px;margin:0 auto;padding:22px clamp(12px,3vw,28px) 60px}
  .adm-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .adm-head .logo{width:36px;height:36px;border-radius:11px;flex:none;background-image:var(--logo-glyph),linear-gradient(135deg,var(--brand),#0a5c43);background-size:100% 100%;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .adm-head h1{font-size:19px;margin:0;font-weight:800}
  .adm-head .sub{color:var(--ink-3);font-size:12px}
  .adm-head .grow{flex:1}
  .adm-tabs{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px;margin-bottom:14px}
  .adm-tabs button{border:0;background:transparent;color:var(--ink-2);padding:7px 16px;border-radius:9px;font-size:14px;font-weight:600}
  .adm-tabs button.active{background:var(--surface);color:var(--brand-ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
  .adm-loginbox{max-width:380px;margin:10vh auto 0}
  .adm-row-ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tbl td .mini{width:104px;padding:5px 7px;font-size:13px}
  .btn.confirm{color:#fff;background:var(--danger);border-color:var(--danger)}
  .adm-foot{margin-top:26px;color:var(--ink-3);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="adm-wrap" id="app"></div>
<div id="toasts"></div>
<script src="js/seed-data.js"></script>
<script>
'use strict';
/* =====================================================
   weFit 管理后台(v4.1)
   - 三态:未登录登录卡 / 已登录非管理员无权限页 / 管理员工作台
   - 分页:用户管理(/api/admin/*,含 2026-09-16 新增的「新建用户」——注册已关时的唯一建号入口)
     + 系统共享库编辑(PUT /api/system/library);
     系统库内部再分「食物库 / 动作库」两个子分页(2026-09-11),增删都走弹窗
   - 危险操作二次确认(按钮变红再点);鉴权靠服务端,本页只呈现
   ===================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
const fmtDate = ms => new Date(ms).toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });

/* 主题:跟随上次选择在两个账户态间保持一致 */
const THEME_KEY = 'wefit_admin_theme';
/* v4.23:旧键 jjhealth_admin_theme → wefit_admin_theme(一次性迁移;新旧并存时保留新键并清掉旧键,与 app.js 同规则) */
try {
  const old = localStorage.getItem('jjhealth_admin_theme');
  if(old !== null){
    if(localStorage.getItem(THEME_KEY) === null) localStorage.setItem(THEME_KEY, old);
    localStorage.removeItem('jjhealth_admin_theme');
  }
} catch(e){}
document.documentElement.setAttribute('data-theme', localStorage.getItem(THEME_KEY) || 'light');
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  const b = $('#thBtn'); if(b) b.textContent = next === 'dark' ? '☀️ 浅色' : '🌙 深色';
}
function toast(msg, isErr){
  const box = $('#toasts'); const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : ''); el.textContent = msg; box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; }, 2400);
  setTimeout(()=> el.remove(), 2800);
}

let me = null;          /* {username, role} */
let tab = 'users';      /* users | lib */
let libDraft = null;    /* 系统库编辑草稿(食物+动作整份,跨子分页共用) */
let libSub = 'foods';   /* 系统库子分页:foods=食物库 | exercises=动作库 */
const OFFLINE_MSG = '连不上服务器：请确认电脑上的服务窗口已开启';
/* v4.4:统一网络/鉴权守卫——连不上(0)/会话失效(401)/被撤权(403)归一收口并返回 false。
 * 三个用户操作按钮曾各自手抄三连判断、同一状态三种文案,renderLib 的保存还漏了 status 0;
 * 后续新增受护 API 只需 if(!guard(r)) return;。 */
function guard(r, msg){
  if(!r) return false;
  if(r.status === 0){ toast(msg || OFFLINE_MSG, true); return false; }
  if(r.status === 401){ on401(); return false; }
  if(r.status === 403){ renderForbidden(); return false; }
  return true;
}

async function api(method, path, body){
  const opt = { method, headers: {} };
  if (body !== undefined) opt.headers['Content-Type'] = 'application/json';
  if (body !== undefined) opt.body = JSON.stringify(body);
  let r;
  /* v4.3：网络层异常(服务未启动/中途宕机)归一为 status:0，调用点据此显示可读提示，
   * 旧版 fetch reject 会让 boot() 抛出未处理拒绝、整页永久空白。 */
  try { r = await fetch('/api' + path, opt); }
  catch(e){ return { status: 0, j: null }; }
  let j = null; try { j = await r.json(); } catch(e){}
  return { status: r.status, j };
}
function on401(){ me = null; renderLogin('会话已过期，请重新登录'); }

/* ---------- 登录 ---------- */
function renderLogin(note){
  $('#app').innerHTML =
    '<div class="auth-card adm-loginbox">' +
      '<div class="auth-logo"><div class="logo" aria-hidden="true"></div>管理后台</div>' +
      '<div class="auth-sub">仅管理员账户可登录 · <a href="/" style="color:var(--brand-ink)">← 返回用户端</a></div>' +
      '<div class="field"><label>用户名</label><input class="input" id="lg_u" autocomplete="username"></div>' +
      '<div class="field"><label>密码</label><input class="input" id="lg_p" type="password" autocomplete="current-password"></div>' +
      '<button class="btn primary block" id="lg_go">登录后台</button>' +
      '<div class="auth-err" id="lg_err"></div>' +
      (note ? '<div class="auth-note">' + esc(note) + '</div>' : '') +
    '</div>';
  const go = async () => {
    const username = $('#lg_u').value.trim(), password = $('#lg_p').value;
    if (!username || !password) { $('#lg_err').textContent = '请填写用户名与密码'; return; }
    const { status, j } = await api('POST', '/login', { username, password });
    if (status === 0) { $('#lg_err').textContent = OFFLINE_MSG; return; }
    if (status === 401) { $('#lg_err').textContent = '用户名或密码不正确'; return; }
    if (status !== 200) { $('#lg_err').textContent = (j && j.message) || '登录失败'; return; }
    $('#lg_err').textContent = '';
    me = { username: (j && j.username) || username, role: (j && j.role) || 'user', version: (j && j.version) || '' };
    boot();
  };
  $('#lg_go').addEventListener('click', go);
  ['lg_u','lg_p'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  $('#lg_u').focus();
}
function renderForbidden(){
  $('#app').innerHTML =
    '<div class="auth-card adm-loginbox">' +
      '<div class="auth-logo"><div class="logo" aria-hidden="true"></div>无管理权限</div>' +
      '<div class="auth-sub">账户「' + esc(me.username) + '」不是管理员。<br>请联系管理员在后台把你设为管理员，或退出后换账户登录。</div>' +
      '<div class="d-f" style="justify-content:center">' +
        '<button class="btn" id="fb_back">← 返回用户端</button>' +
        '<button class="btn danger" id="fb_logout">退出登录</button>' +
      '</div>' +
    '</div>';
  $('#fb_back').addEventListener('click', () => { location.href = '/'; });
  $('#fb_logout').addEventListener('click', doLogout);
}
async function doLogout(){
  /* v4.3：拿到服务器确认(或会话本就失效)才清本地——否则 Cookie 仍在，下次打开自动回到原账户 */
  const { status } = await api('POST', '/logout', {});
  if (status !== 200 && status !== 401){ toast('服务器未确认退出，会话可能仍有效——请重试', true); return; }
  me = null; renderLogin();
}

/* ---------- 工作台 ---------- */
function renderShell(){
  $('#app').innerHTML =
    '<div class="adm-head">' +
      '<div class="logo" aria-hidden="true"></div>' +
      '<div><h1>健康管理 · 管理后台</h1><div class="sub">已登录：' + esc(me.username) + '（管理员）</div></div>' +
      '<span class="grow"></span>' +
      '<button class="btn sm" id="thBtn">主题</button>' +
      '<a class="btn sm" href="/" style="text-decoration:none">用户端</a>' +
      '<button class="btn sm" id="outBtn">退出登录</button>' +
    '</div>' +
    '<div class="adm-tabs"><button data-t="users">👥 用户管理</button><button data-t="lib">📚 系统共享库</button></div>' +
    '<div id="tabBody"></div>' +
    /* 版本号 = /api/me 或 /api/login 下发（来源 = server/package.json）；旧服务端没带该字段时不显示 */
    '<div class="adm-foot">' + (me.version ? 'weFit v' + esc(String(me.version)) + ' · ' : '') +
      '第一个注册的账户自动成为管理员 · 系统至少保留一名管理员 · 撤权即时生效，被撤者仍正常使用用户端</div>';
  $('#thBtn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️ 浅色' : '🌙 深色';
  $('#thBtn').addEventListener('click', toggleTheme);
  $('#outBtn').addEventListener('click', doLogout);
  $$('.adm-tabs button').forEach(b => b.addEventListener('click', () => {
    if (curDialog) curDialog.close();   /* 顶部分页切走时关掉可能开着的添加弹窗（否则弹窗留在 body 上、加完还会把分页重绘错） */
    tab = b.dataset.t; paintTabs(); renderTab();
  }));
  paintTabs();
}
function paintTabs(){ $$('.adm-tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === tab)); }
function renderTab(){ if (tab === 'users') renderUsers(); else renderLib(); }

/* ---------- 用户管理 ---------- */
async function renderUsers(){
  const box = $('#tabBody');
  box.innerHTML = '<div class="tiny muted">载入用户列表…</div>';
  await loadUsers(box);   /* 401/403/0 已在 loadUsers 内统一收口 */
}
let usersList = [];
async function loadUsers(box){
  const { status, j } = await api('GET', '/admin/users');
  if (status === 403) { renderForbidden(); return; }   /* 中途被撤权 */
  if (status === 401) { on401(); return; }
  if (status === 0) { box.innerHTML = '<div class="card"><div class="empty">' + OFFLINE_MSG + '</div></div>'; return; }
  if (status !== 200) { box.innerHTML = '<div class="card"><div class="empty">载入失败（HTTP ' + status + '）</div></div>'; return; }
  usersList = j.users;
  box.innerHTML =
    '<div class="card"><h3><span>👥 用户管理（' + usersList.length + ' 个账户）</span><span class="grow"></span>' +
    '<button class="btn sm primary" id="u_new">＋ 新建用户</button></h3>' +
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
      '<th>账户</th><th>昵称</th><th>角色</th><th>数据概况</th><th>同步版本</th><th>注册于</th><th style="text-align:right">操作</th>' +
    '</tr></thead><tbody>' +
    usersList.map(u => {
      const c = u.counts || {};
      const meta = '饮食条目 ' + (c.meals || 0) + ' · 身体 ' + (c.body || 0) + ' · 运动 ' + (c.workouts || 0);
      return '<tr data-u="' + esc(u.username) + '">' +
        '<td><b>' + esc(u.username) + '</b>' + (u.username === me.username ? ' <span class="chip slot" style="font-size:10px;padding:1px 7px">当前</span>' : '') + '</td>' +
        '<td>' + esc(u.name || '—') + '</td>' +
        '<td>' + (u.role === 'admin' ? '<span class="chip b3" style="padding:1px 9px;font-size:12px">管理员</span>' : '<span class="chip" style="padding:1px 9px;font-size:12px">用户</span>') + '</td>' +
        '<td class="tiny muted">' + esc(meta) + '</td>' +
        '<td class="tiny">rev ' + u.rev + '</td>' +
        '<td class="tiny muted">' + fmtDate(u.createdAt) + '</td>' +
        '<td><div class="adm-row-ops">' +
          '<button class="btn sm" data-act="role">' + (u.role === 'admin' ? '撤销管理员' : '设为管理员') + '</button>' +
          '<input class="input mini" type="password" placeholder="新密码" data-act="pw">' +
          '<button class="btn sm ghost" data-act="pw">重置密码</button>' +
          '<button class="btn sm ghost" data-act="del" style="color:var(--danger)">删除</button>' +
        '</div></td></tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div class="tiny muted" style="margin-top:10px">新建用户不受用户端注册开关影响;重置密码会让该账户(含你自己)的所有设备下线并需重新登录;删除账户会级联清空其全部记录,不可恢复。</div></div>';
  bindUsers();
}
function bindUsers(){
  const btnNew = $('#u_new'); if (btnNew) btnNew.addEventListener('click', openUserDialog);
  $$('#tabBody tbody tr').forEach(tr => {
    const username = tr.dataset.u;
    const row = usersList.find(u => u.username === username);
    const btnRole = tr.querySelector('[data-act="role"]');
    const pwInp = tr.querySelector('input[data-act="pw"]');
    const btnPw = tr.querySelector('button[data-act="pw"]');
    const btnDel = tr.querySelector('[data-act="del"]');
    btnRole.addEventListener('click', async () => {
      const next = row.role === 'admin' ? 'user' : 'admin';
      const r = await api('PUT', '/admin/role', { username, role: next });
      if (!guard(r)) return;   /* v4.4:0(连不上)/401/403 统一收口(旧版三连手抄) */
      if (r.status === 400 && r.j && r.j.error === 'last_admin') return toast('系统至少保留一名管理员', true);
      if (r.status !== 200) return toast('操作失败（HTTP ' + r.status + '）', true);
      if (r.j.self && next === 'user') { toast('你已不再是管理员，后台即将返回登录视图'); me = { username: me.username, role: 'user' }; renderForbidden(); return; }
      toast(next === 'admin' ? '已设为管理员' : '已撤销管理员'); loadUsers($('#tabBody'));
    });
    btnPw.addEventListener('click', async () => {
      const password = pwInp.value;
      if (password.length < 6) return toast('新密码至少 6 位', true);
      if (!confirm2(btnPw, '确认重置?')) return;
      const r = await api('PUT', '/admin/password', { username, password });
      if (!guard(r)) return;   /* v4.4:统一收口 */
      if (r.status !== 200) return toast((r.j && r.j.message) || '重置失败', true);
      if (r.j.self) { toast('你的密码已重置，需重新登录'); me = null; renderLogin(); return; }
      toast('已重置，' + username + ' 需重新登录'); loadUsers($('#tabBody'));
    });
    btnDel.addEventListener('click', async () => {
      if (!confirm2(btnDel, '确认删除?')) return;
      const r = await api('DELETE', '/admin/users', { username });
      if (!guard(r)) return;   /* v4.4:统一收口 */
      if (r.status === 400) return toast((r.j && r.j.message) || (r.j && r.j.error === 'cannot_delete_self' ? '不能删除自己的账户' : '操作被拒绝'), true);
      if (r.status !== 200) return toast('删除失败（HTTP ' + r.status + '）', true);
      toast('已删除账户 ' + username + ' 及其全部数据'); loadUsers($('#tabBody'));
    });
  });
}
/* 新建用户(2026-09-16):管理员代建号,不受 ALLOW_REGISTER 影响——公网「注册已关」时这是唯一的建号入口。
 * 服务端不给新建账户下发会话 Cookie,所以你建完仍是当前管理员(不会顶掉自己的登录)。
 * 新账户个人库为空(不拷贝系统库),要什么自行从系统库挑入。 */
function openUserDialog(){
  showDialog('新建用户',
    '<div class="field"><label>用户名</label><input class="input" id="nu_u" placeholder="2-32 位字母/数字/下划线/连字符" autocomplete="off"></div>' +
    '<div class="field"><label>昵称</label><input class="input" id="nu_n" placeholder="如：陈" autocomplete="off"></div>' +
    '<div class="field"><label>初始密码</label><input class="input" id="nu_p" type="text" placeholder="6-128 位" autocomplete="new-password"></div>' +
    '<div class="field"><label>角色</label><select class="select" id="nu_r"><option value="user">用户</option><option value="admin">管理员（可进入本后台）</option></select></div>' +
    '<div class="tiny muted">新账户的个人库初始为空（不拷贝系统库），需自行从系统库挑入；初始密码请线下告知使用者（用户端暂无自助改密，遗忘时由你在本页重置）。</div>' +
    '<div class="d-f"><button class="btn ghost" id="nu_cancel">取消</button><button class="btn primary" id="nu_ok">创建</button></div>',
    (b, close) => {
      const q = s => b.querySelector(s);
      const create = async () => {
        const username = q('#nu_u').value.trim(), name = q('#nu_n').value.trim(), password = q('#nu_p').value;
        if (!username || !password) return toast('请填写用户名与初始密码', true);
        if (!name) return toast('请填写昵称', true);
        const btn = q('#nu_ok'); btn.disabled = true;   /* 建号要跑 scrypt+写事务,防连点双提交 */
        const r = await api('POST', '/admin/users', { username, password, name, role: q('#nu_r').value });
        btn.disabled = false;
        if (!guard(r)) return;   /* 0(连不上)/401/403 统一收口 */
        if (r.status === 409) return toast('用户名「' + username + '」已存在', true);
        if (r.status === 400) return toast((r.j && r.j.message) || '用户名或密码不符合要求', true);
        if (r.status !== 201 && r.status !== 200) return toast('创建失败（HTTP ' + r.status + '）', true);
        toast('已创建账户 ' + username + '（' + ((r.j && r.j.role) === 'admin' ? '管理员' : '用户') + '）');
        close(); loadUsers($('#tabBody'));
      };
      q('#nu_ok').addEventListener('click', create);
      q('#nu_cancel').addEventListener('click', close);
      ['nu_u','nu_n','nu_p'].forEach(s => q('#' + s).addEventListener('keydown', e => { if (e.key === 'Enter') create(); }));
      q('#nu_u').focus();
    });
}
/* 二次确认:第一次点击把按钮变红改文案,5 秒内再点一次才执行 */
const confirmTimers = new WeakMap();
function confirm2(btn, text){
  if (btn.dataset.armed === '1') {
    clearTimeout(confirmTimers.get(btn)); btn.dataset.armed = ''; btn.classList.remove('confirm'); btn.textContent = btn.dataset.orig;
    return true;
  }
  btn.dataset.orig = btn.textContent; btn.textContent = text; btn.classList.add('confirm'); btn.dataset.armed = '1';
  confirmTimers.set(btn, setTimeout(() => { btn.dataset.armed = ''; btn.classList.remove('confirm'); btn.textContent = btn.dataset.orig; }, 5000));
  return false;
}

/* ---------- 系统共享库 ---------- */
async function renderLib(){
  const box = $('#tabBody');
  box.innerHTML = '<div class="tiny muted">载入系统库…</div>';
  const { status, j } = await api('GET', '/system/library');
  if (status === 403) { renderForbidden(); return; }   /* v4.4:中途被撤权与用户管理页口径一致 */
  if (status === 401) return on401();
  if (status === 0) { box.innerHTML = '<div class="card"><div class="empty">' + OFFLINE_MSG + '</div></div>'; return; }
  if (status !== 200) { box.innerHTML = '<div class="card"><div class="empty">载入失败（HTTP ' + status + '）</div></div>'; return; }
  if (!libDraft) libDraft = { foods: j.foods, exercises: j.exercises };  /* 切分页保留未保存的草稿；「放弃修改并重载」显式重置 */
  paintLib();
}
/* 通用单层弹窗(样式复用用户端 style.css 的 .overlay/.dialog) */
let curDialog = null;
function showDialog(title, html, onOpen){
  const ov = document.createElement('div'); ov.className = 'overlay';
  const d = document.createElement('div'); d.className = 'dialog';
  d.innerHTML = '<div class="d-h"><div class="d-t">' + esc(title) + '</div><button class="d-x" type="button">✕</button></div><div class="d-b"></div>';
  const box = d.querySelector('.d-b');
  box.insertAdjacentHTML('beforeend', html);
  ov.appendChild(d);
  const entry = {};
  entry.box = box;
  entry.close = function(){
    ov.remove();
    document.removeEventListener('keydown', esk);
    if (curDialog === entry) curDialog = null;
  };
  function esk(e){ if (e.key === 'Escape') entry.close(); }
  document.addEventListener('keydown', esk);
  ov.addEventListener('mousedown', e => { if (e.target === ov) entry.close(); });
  d.querySelector('.d-x').addEventListener('click', entry.close);
  document.body.appendChild(ov);
  curDialog = entry;
  if (onOpen) onOpen(box, entry.close);
  return entry;
}

/* 2026-09-11：食物库 / 动作库拆成两个子分页（原「两卡竖排」已删）；
 * 增删一律走弹窗（原先内联的「＋食物 / ＋动作」表单已删）。
 * 两个子分页共用一份草稿 libDraft 和底部「放弃修改并重载 / 保存系统库」，切分页不丢草稿。 */
function libSegHTML(){
  const b = (k, label) => '<button data-lt="' + k + '" class="' + (libSub === k ? 'active' : '') + '">' + label + '</button>';
  return '<div class="seg" id="libSeg">' + b('foods', '🥗 食物库（' + libDraft.foods.length + '）') + b('exercises', '🏋️ 动作库（' + libDraft.exercises.length + '）') + '</div>';
}
/* 营养来源小签（与用户端食物库同一口径：缺 src 的存量条目按系统库来源 USDA 兜底） */
function srcChip(f){
  return '<span class="chip slot" style="margin-left:6px;font-weight:600">' + esc(f.src || FOOD_SRC_SYS) + '</span>';
}
function foodPanelHTML(){
  const rows = libDraft.foods.length
    ? libDraft.foods.map((f, i) =>
      '<div class="lrow"><div class="grow"><div class="b small">' + esc(f.name) + srcChip(f) + '</div>' +
      '<div class="sub">' + (f.per100 ? ('每100g：' + Math.round(f.per100.kcal || 0) + ' kcal · P' + (f.per100.p || 0) + ' C' + (f.per100.c || 0) + ' F' + (f.per100.f || 0)) : '无营养表') + '</div></div>' +
      '<button class="iconbtn2" data-df="' + i + '" title="删除" style="color:var(--danger)">🗑</button></div>').join('')
    : '<div class="empty"><div class="e-ic">🥗</div>系统库暂无食物</div>';
  return '<div class="card"><h3><span>🥗 食物库</span><span class="grow"></span>' +
    '<button class="btn sm primary" id="lf_new">＋ 添加食物</button></h3>' + rows + '</div>';
}
function exPanelHTML(){
  const rows = libDraft.exercises.length
    ? '<div style="overflow-x:auto"><table class="libtable"><thead><tr><th>名称</th><th>分类</th><th>方式</th><th></th></tr></thead><tbody>' +
      libDraft.exercises.map((e, i) =>
        '<tr><td>' + esc(e.name) + '</td><td class="tiny muted">' + esc([e.cat, e.muscle].filter(Boolean).join(' · ') || '—') + '</td>' +
        '<td class="tiny muted">' + esc(SEED_MODE_CN[e.mode] || '—') + '</td>' +
        '<td class="ta-r"><button class="iconbtn2" data-dx="' + i + '" title="删除" style="color:var(--danger)">🗑</button></td></tr>').join('') +
      '</tbody></table></div>'
    : '<div class="empty"><div class="e-ic">🏋️</div>系统库暂无动作</div>';
  return '<div class="card"><h3><span>🏋️ 动作库</span><span class="grow"></span>' +
    '<button class="btn sm primary" id="lx_new">＋ 添加动作</button></h3>' + rows + '</div>';
}
function paintLib(){
  const box = $('#tabBody');
  box.innerHTML =
    '<div style="margin-bottom:12px">' + libSegHTML() + '</div>' +
    (libSub === 'foods' ? foodPanelHTML() : exPanelHTML()) +
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" id="lib_reload">放弃修改并重载</button><button class="btn primary" id="lib_save">保存系统库</button></div>' +
    '<div class="tiny muted" style="margin-top:8px">保存后对所有用户立即可见（用户端「系统库」分页）。已注册用户已有的个人库不会被追溯改动，用户可自行从系统库挑入新条目。</div>';
  bindLib();
}
/* 添加弹窗：加完不关（连续录入多条），只清空并聚焦回名称；后面分页即时重绘刷新计数 */
function refreshLibPanel(){ if (tab === 'lib' && libDraft) paintLib(); }
function openFoodDialog(){
  showDialog('添加食物（系统库）',
    '<div class="field"><label>食物名称</label><input class="input" id="fd_n" placeholder="如：鸡胸肉"></div>' +
    '<div class="field"><label>营养来源</label><input class="input" id="fd_s" value="' + FOOD_SRC_SYS + '" placeholder="如：USDA / 中国食物成分表"></div>' +
    '<div class="form-grid">' +
      '<div><label>热量 kcal / 100g</label><input class="input" id="fd_k" type="number" min="0" inputmode="decimal"></div>' +
      '<div><label>蛋白质 g / 100g</label><input class="input" id="fd_p" type="number" min="0" inputmode="decimal"></div>' +
      '<div><label>碳水 g / 100g</label><input class="input" id="fd_c" type="number" min="0" inputmode="decimal"></div>' +
      '<div><label>脂肪 g / 100g</label><input class="input" id="fd_f" type="number" min="0" inputmode="decimal"></div>' +
    '</div>' +
    '<div class="tiny muted" style="margin-top:10px">营养值留空按 0 记；来源是这条营养数据的出处（用户端食物库每行会显示）。添加只改本页草稿，点「保存系统库」才写入服务器。</div>' +
    '<div class="d-f"><button class="btn ghost" id="fd_done">完成</button><button class="btn primary" id="fd_ok">添加</button></div>',
    (b, close) => {
      const q = s => b.querySelector(s);
      const add = () => {
        const name = q('#fd_n').value.trim();
        if (!name) return toast('请填写食物名称', true);
        if (libDraft.foods.some(f => f.name === name)) return toast('系统库里已有同名食物', true);
        libDraft.foods.push({ name, src: q('#fd_s').value.trim() || FOOD_SRC_SYS, per100: { kcal: +q('#fd_k').value || 0, p: +q('#fd_p').value || 0, c: +q('#fd_c').value || 0, f: +q('#fd_f').value || 0 } });
        refreshLibPanel();   /* 弹窗挂在 body 上，重绘分页不影响它 */
        toast('已加入草稿：' + name + '（记得「保存系统库」）');
        ['#fd_n', '#fd_k', '#fd_p', '#fd_c', '#fd_f'].forEach(s => { q(s).value = ''; });   /* 来源保留上次填的，连续录入同一来源不用重填 */
        q('#fd_n').focus();
      };
      q('#fd_ok').addEventListener('click', add);
      q('#fd_done').addEventListener('click', close);
      q('#fd_n').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      q('#fd_n').focus();
    });
}
function openExDialog(){
  showDialog('添加动作（系统库）',
    '<div class="field"><label>动作名称</label><input class="input" id="xd_n" placeholder="如：杠铃卧推"></div>' +
    '<div class="form-grid">' +
      '<div><label>大类</label><select class="select" id="xd_c">' + SEED_CATS.map(c => '<option>' + c + '</option>').join('') + '</select></div>' +
      '<div><label>部位</label><select class="select" id="xd_m">' + SEED_MUSCLES.map(m => '<option>' + m + '</option>').join('') + '</select></div>' +
      '<div><label>记录方式</label><select class="select" id="xd_md">' + SEED_MODES.map(m => '<option value="' + m + '">' + SEED_MODE_CN[m] + '</option>').join('') + '</select></div>' +
    '</div>' +
    '<div class="tiny muted" style="margin-top:10px">三件套与用户端同源（seed-data.js）；换大类会自动带出该大类的默认部位与记录方式，仍可手改（如「核心 + 计时」= 平板支撑）。添加只改本页草稿。</div>' +
    '<div class="d-f"><button class="btn ghost" id="xd_done">完成</button><button class="btn primary" id="xd_ok">添加</button></div>',
    (b, close) => {
      const q = s => b.querySelector(s);
      const cat = q('#xd_c'), mus = q('#xd_m'), mod = q('#xd_md');
      const sync = () => { mus.value = muscleDefault(cat.value); mod.value = modeDefault(cat.value); };
      cat.addEventListener('change', sync);
      sync();
      const add = () => {
        const name = q('#xd_n').value.trim();
        if (!name) return toast('请填写动作名称', true);
        if (libDraft.exercises.some(e => e.name === name)) return toast('系统库里已有同名动作', true);
        libDraft.exercises.push({ name, cat: cat.value, muscle: mus.value, mode: mod.value });
        refreshLibPanel();
        toast('已加入草稿：' + name + '（记得「保存系统库」）');
        q('#xd_n').value = '';
        q('#xd_n').focus();
      };
      q('#xd_ok').addEventListener('click', add);
      q('#xd_done').addEventListener('click', close);
      q('#xd_n').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      q('#xd_n').focus();
    });
}
function bindLib(){
  const box = $('#tabBody');
  $$('#libSeg [data-lt]').forEach(b => b.addEventListener('click', () => { libSub = b.dataset.lt; paintLib(); }));
  $$('[data-df]', box).forEach(b => b.addEventListener('click', () => { libDraft.foods.splice(+b.dataset.df, 1); paintLib(); }));
  $$('[data-dx]', box).forEach(b => b.addEventListener('click', () => { libDraft.exercises.splice(+b.dataset.dx, 1); paintLib(); }));
  const fnew = $('#lf_new'); if (fnew) fnew.addEventListener('click', openFoodDialog);
  const xnew = $('#lx_new'); if (xnew) xnew.addEventListener('click', openExDialog);
  $('#lib_reload').addEventListener('click', () => { libDraft = null; renderLib(); });
  $('#lib_save').addEventListener('click', async () => {
    const body = { foods: libDraft.foods, exercises: libDraft.exercises };
    const r = await api('PUT', '/system/library', body);
    if (!guard(r)) return;   /* v4.4:补上 status 0 分支(旧版服务器宕机时弹「保存失败(HTTP 0)」) */
    if (r.status !== 200) return toast((r.j && r.j.message) || '保存失败（HTTP ' + r.status + '）', true);
    libDraft = null; toast('系统库已保存'); renderLib();
  });
}

/* ---------- 启动 ---------- */
async function boot(){
  if (!me) {
    const { status, j } = await api('GET', '/me');
    if (status === 200) me = { username: (j && j.username) || '', role: (j && j.role) || 'user', version: (j && j.version) || '' };
    else { renderLogin(status === 0 ? OFFLINE_MSG : undefined); return; }
  }
  /* v4.4:删除角色实测探测块——/me 的 role 与 requireAdmin 读同一张 accounts 表、同一时刻,
   * 重检不可能翻案,却会:丢弃 200 载荷后 renderTab 又整表拉一次(双倍请求);且 500 等
   * 状态穿透时把普通用户误设成 admin UI。五个管理面自带 401/403/0 守卫,非管理员在
   * 首个管理请求后自然落到「无管理权限」页。 */
  renderShell(); renderTab();
}
boot();
</script>
